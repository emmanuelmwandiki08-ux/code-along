<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Address Book & Places Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .clickable-item { cursor: pointer; transition: 0.2s; }
    .clickable-item:hover { background-color: #e9ecef; }
  </style>
</head>
<body>
  <div class="container my-5">
    <header class="text-center mb-5">
      <h1 class="display-4 fw-bold text-primary">Personal Manager Dashboard</h1>
      <p class="lead text-muted">Manage your network and track your global adventures.</p>
    </header>

    <div class="row g-5">
     
      <div class="col-md-6">
        <div class="card shadow-sm p-4">
          <h2 class="h4 border-bottom pb-2 mb-4 text-secondary">📖 Address Book</h2>
          <form id="new-contact-form" class="mb-4">
            <div class="row g-2 mb-3">
              <div class="col"><input type="text" id="first-name" class="form-control" placeholder="First Name" required></div>
              <div class="col"><input type="text" id="last-name" class="form-control" placeholder="Last Name" required></div>
            </div>
            <div class="mb-3"><input type="tel" id="phone" class="form-control" placeholder="Phone Number" required></div>
            <div class="mb-3"><input type="text" id="address" class="form-control" placeholder="Physical Address" required></div>
            <button type="submit" class="btn btn-primary w-100">Add Contact</button>
          </form>

          <h3 class="h5">Contacts List</h3>
          <ul id="contacts-list" class="list-group mb-3"></ul>
          <div id="contact-details" class="p-3 bg-light rounded d-none border"></div>
        </div>
      </div>

      
      <div class="col-md-6">
        <div class="card shadow-sm p-4">
          <h2 class="h4 border-bottom pb-2 mb-4 text-secondary">✈️ Places You've Been</h2>
          <form id="new-place-form" class="mb-4">
            <div class="mb-3"><input type="text" id="place-location" class="form-control" placeholder="Location (e.g., Tokyo, Japan)" required></div>
            <div class="mb-3"><input type="text" id="place-landmarks" class="form-control" placeholder="Landmarks (e.g., Mount Fuji)" required></div>
            <div class="mb-3"><input type="text" id="place-time" class="form-control" placeholder="Time of Year (e.g., Spring 2025)" required></div>
            <div class="mb-3"><textarea id="place-notes" class="form-control" rows="2" placeholder="Notes..."></textarea></div>
            <button type="submit" class="btn btn-success w-100">Log Destination</button>
          </form>

          <h3 class="h5">Destinations</h3>
          <ul id="places-list" class="list-group mb-3"></ul>
          <div id="place-details" class="p-3 bg-light rounded d-none border"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="java.js"></script>
</body>
</html>
